<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Yogurt H3 Director：MiniMax H3 可视化时间线导演台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#18202a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#3fb6a8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a4d"/>
      <stop offset="0.62" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5c"/>
      <stop offset="1" stop-color="#c8382d"/>
    </linearGradient>
    <pattern id="carry" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#0e1116" opacity="0.4"/>
    </pattern>
    <clipPath id="stage"><rect x="820" y="44" width="396" height="223" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="64" y="78" font-size="15" font-weight="600" letter-spacing="2.5" fill="#7aa7ff">COMFYUI · MINIMAX H3</text>
    <text x="62" y="146" font-size="60" font-weight="700" fill="#e8ecef">Yogurt H3 Director</text>
    <text x="64" y="194" font-size="30" font-weight="500" fill="#d3dae1">可视化时间线导演台</text>
    <text x="64" y="232" font-size="18" fill="#9aa5b1">文生 · 首尾帧 · 参考 · 源视频改写 · 局部重绘 · 二采 · 剧情改写</text>
  </g>

  <!-- Stage: a 文字识别 selection, the frame dimmed outside the tracked figure. -->
  <g clip-path="url(#stage)">
    <rect x="820" y="44" width="396" height="223" fill="url(#scene)"/>
    <rect x="820" y="214" width="396" height="53" fill="#0f141b"/>
    <g fill="#3a4b60" opacity="0.7">
      <rect x="846" y="104" width="34" height="110"/>
      <rect x="1142" y="88" width="46" height="126"/>
      <rect x="884" y="132" width="22" height="82"/>
    </g>
    <circle cx="1018" cy="122" r="25" fill="#f0c4a8"/>
    <path d="M992 116 q26 -38 52 0 v-6 q-26 -34 -52 0 z" fill="#1b1b22"/>
    <rect x="986" y="148" width="64" height="98" rx="26" fill="url(#coat)"/>
    <rect x="820" y="44" width="396" height="223" fill="#05080c" opacity="0.55" mask="url(#cut)"/>
    <mask id="cut">
      <rect x="820" y="44" width="396" height="223" fill="#fff"/>
      <circle cx="1018" cy="122" r="27" fill="#000"/>
      <rect x="984" y="146" width="68" height="102" rx="28" fill="#000"/>
    </mask>
    <path d="M1018 90 a33 33 0 0 1 33 33 v18 q7 4 8 12 v74 q0 26 -41 26 q-41 0 -41 -26 v-74 q1 -8 8 -12 v-18 a33 33 0 0 1 33 -33 z"
          fill="none" stroke="#7aa7ff" stroke-width="2.5" stroke-dasharray="7 5"/>
  </g>
  <rect x="820" y="44" width="396" height="223" rx="10" fill="none" stroke="#3a414b" stroke-width="1.5"/>
  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <rect x="836" y="58" width="244" height="28" rx="14" fill="#0e1116" opacity="0.82"/>
    <circle cx="853" cy="72" r="5" fill="#7aa7ff"/>
    <text x="866" y="77" font-size="14" fill="#e8ecef">文字识别 · girl in red raincoat</text>
  </g>

  <!-- Timeline: generated shots, a source shot, the continuation overlap, repaint marks and the playhead. -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="11" fill="#6c7782">
    <g stroke="#2c333c" stroke-width="1">
      <line x1="64" y1="282" x2="64" y2="288"/><line x1="256" y1="282" x2="256" y2="288"/><line x1="448" y1="282" x2="448" y2="288"/>
      <line x1="640" y1="282" x2="640" y2="288"/><line x1="832" y1="282" x2="832" y2="288"/><line x1="1024" y1="282" x2="1024" y2="288"/>
      <line x1="1216" y1="282" x2="1216" y2="288"/>
    </g>
    <text x="68" y="280">0s</text><text x="260" y="280">4s</text><text x="452" y="280">8s</text><text x="644" y="280">12s</text>
    <text x="836" y="280">16s</text><text x="1028" y="280">20s</text>
  </g>
  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#0b1014">
    <rect x="64" y="292" width="300" height="34" rx="6" fill="#3fb6a8"/>
    <rect x="324" y="292" width="40" height="34" fill="url(#carry)"/>
    <text x="76" y="314">1 · 文生</text>
    <rect x="368" y="292" width="250" height="34" rx="6" fill="#3fb6a8"/>
    <text x="380" y="314">2 · 续接</text>
    <rect x="622" y="292" width="280" height="34" rx="6" fill="#e0a14a"/>
    <text x="634" y="314">3 · 源视频</text>
    <rect x="906" y="292" width="310" height="34" rx="6" fill="#3fb6a8"/>
    <text x="918" y="314">4 · 参考</text>
  </g>
  <rect x="676" y="330" width="150" height="4" rx="2" fill="#ff8a2a"/>
  <rect x="1010" y="330" width="96" height="4" rx="2" fill="#7aa7ff"/>
  <line x1="740" y1="284" x2="740" y2="338" stroke="#ffffff" stroke-width="2"/>
  <circle cx="740" cy="284" r="4.5" fill="#ffffff"/>
</svg>
